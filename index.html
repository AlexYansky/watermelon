<!DOCTYPE html>
<html lang="ru">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
    <title>Спелый арбуз</title>
    <style>
        body { font-family: -apple-system, BlinkMacSystemFont, sans-serif; background: #f0f4f1; color: #2c3e50; padding: 10px; margin: 0; }
        .card { background: white; padding: 20px; border-radius: 20px; box-shadow: 0 10px 30px rgba(0,0,0,0.08); max-width: 420px; margin: 5px auto; box-sizing: border-box; }
        h1 { text-align: center; color: #1b5e20; font-size: 22px; margin-top: 0; margin-bottom: 5px; }
        .subtitle { text-align: center; color: #7f8c8d; font-size: 12px; margin-bottom: 15px; }
        label { display: block; font-weight: bold; margin: 12px 0 5px; font-size: 13px; color: #34495e; }
        select, input { width: 100%; padding: 12px; border: 2px solid #bdc3c7; border-radius: 10px; box-sizing: border-box; font-size: 15px; outline: none; background: #fff; }
        .input-wrapper { position: relative; width: 100%; }
        .input-icon { position: absolute; left: 14px; top: 50%; transform: translateY(-50%); font-size: 18px; color: #7f8c8d; pointer-events: none; }
        .with-icon { padding-left: 42px; }
        button { width: 100%; background: #4caf50; color: white; border: none; padding: 15px; border-radius: 10px; font-size: 16px; font-weight: bold; margin-top: 20px; cursor: pointer; }
        #result { margin-top: 20px; padding: 15px; border-radius: 12px; display: none; text-align: center; font-size: 14px; line-height: 1.5; }
        .ripe { background: #e8f5e9; color: #1b5e20; border: 2px solid #81c784; }
        .unripe { background: #ffebee; color: #b71c1c; border: 2px solid #e57373; }
        .overripe { background: #fff8e1; color: #f57f17; border: 2px solid #ffb74d; }
        .cheat { background: #eceff1; color: #37474f; border: 2px solid #b0bec5; }
        .hint-box { background: #f4f9f4; border-left: 4px solid #4caf50; border-radius: 4px; padding: 10px 12px; margin: 12px 0; font-size: 12px; line-height: 1.4; color: #2e7d32; }
        .score-badge { display: inline-block; font-size: 24px; font-weight: bold; margin-bottom: 8px; padding: 5px 15px; border-radius: 10px; background: rgba(255,255,255,0.6); }
        .weight-hint { margin-top: 5px; font-size: 12px; color: #2e7d32; font-weight: 500; display: none; padding-left: 5px; }
        .score-info { font-size: 11px; margin-top: 6px; font-weight: bold; opacity: 0.8; }
        #photo-section { display: none; margin-top: 12px; background: #fafafa; border: 2px dashed #bdc3c7; padding: 12px; border-radius: 10px; text-align: center; }
        .canvas-container { position: relative; width: 320px; margin: 12px auto 0 auto; display: none; touch-action: none; background: #000; border-radius: 8px; overflow: hidden; }
        canvas { display: block; width: 320px; height: auto; }
        .controls-hint { font-size: 11px; color: #666; margin-top: 6px; background: #fff; padding: 6px; border-radius: 6px; border: 1px solid #e0e0e0; }
        .control-group { display: flex; gap: 6px; margin-top: 6px; }
        .control-btn { flex: 1; padding: 8px; font-size: 12px; background: #e0e0e0; border: none; border-radius: 6px; font-weight: bold; cursor: pointer; }
        .control-btn.active { background: #4caf50; color: white; }
        .control-subgroup { display: flex; flex-direction: row; flex: 1; gap: 4px; }
        .sub-btn { flex: 1; padding: 8px 4px; font-size: 11px; background: #cfd8dc; border: none; border-radius: 4px; font-weight: bold; cursor: pointer; }
    </style>
</head>
<body>
<div class="card">
    <h1>🍉 Спелый арбуз</h1>
    <div class="subtitle">Расчет спелости и лазерный экспресс-обвес</div>
    
    <label for="variety">Тип / Сорт арбуза</label>
    <select id="variety" onchange="updateWeightHint()">
        <option value="oval">Вытянутый / Овальный</option>
        <option value="classic">Обычный круглый полосатый</option>
        <option value="yellow">Желтый / Без семечек</option>
    </select>
    
    <label for="method">Метод измерения габаритов</label>
    <select id="method" onchange="toggleMethod()">
        <option value="tape">Измерение сантиметровой лентой</option>
        <option value="coin1">Автомасштаб: по 1 рублевой монете</option>
        <option value="coin5">Автомасштаб: по 5 рублевой монете</option>
        <option value="coin10">Автомасштаб: по 10 рублевой монете</option>
        <option value="card">Автомасштаб: по plastic карте</option>
    </select>

    <div class="hint-box">
        💡 <b>Правило замера:</b> Лента или фото должны фиксировать арбуз строго <b>поперек (по экватору)</b>. Маркер (монету/карту) положите по центру арбуза.
    </div>

    <div id="tape-section">
        <label for="circ">Длина окружности (см)</label>
        <div class="input-wrapper">
            <span class="input-icon">📏</span>
            <input type="number" id="circ" class="with-icon" placeholder="Введите обхват поперек" oninput="updateWeightHint()">
        </div>
    </div>

    <div id="photo-section">
        <label style="margin-top:0;">📷 Загрузите фото арбуза с маркером</label>
        <input type="file" id="file-input" accept="image/*" onchange="handlePhoto(event)">
        
        <div class="canvas-container" id="canvas-container">
            <canvas id="scanner-canvas"></canvas>
            <div class="controls-hint">👆 Тащите круги пальцем. Выберите режим и настраивайте ширину/высоту контура под объект.</div>
            <div class="control-group">
                <button class="control-btn active" id="mode-melon" onclick="setEditMode('melon')">🟢 Визир Арбуза</button>
                <button class="control-btn" id="mode-marker" onclick="setEditMode('marker')">🔴 Визир Маркера</button>
            </div>
            
            <div class="control-group" id="size-controls-area">
                <div class="control-subgroup" id="melon-controls" style="display: flex; width: 100%;">
                    <button class="sub-btn" onclick="adjustSize('width', 3)">↔️ Шир.➕</button>
                    <button class="sub-btn" onclick="adjustSize('width', -3)">↔️ Шир.➖</button>
                    <button class="sub-btn" onclick="adjustSize('height', 3)">↕️ Выс.➕</button>
                    <button class="sub-btn" onclick="adjustSize('height', -3)">↕️ Выс.➖</button>
                </div>
                <div class="control-subgroup" id="marker-controls" style="display: none; width: 100%;">
                    <button class="sub-btn" style="background:#ffc107;" onclick="adjustSize('all', 2)">➕ Больше маркер</button>
                    <button class="sub-btn" style="background:#ffc107;" onclick="adjustSize('all', -2)">➖ Меньше маркер</button>
                </div>
            </div>
            <button class="control-btn" id="card-orient-btn" style="margin-top:6px; background:#37474f; color:white; display:none;" onclick="toggleCardOrientation()">🔄 Развернуть карту</button>
        </div>
    </div>

    <label for="weight" style="margin-top:15px;">Точный вес арбуза (кг)</label>
    <div class="input-wrapper">
        <span class="input-icon">⚖️</span>
        <input type="number" id="weight" class="with-icon" placeholder="Например: 8.63" step="0.01">
    </div>
    <div id="weight-hint-text" class="weight-hint"></div>

    <button onclick="analyzeWatermelon()">Проверить спелость</button>
    <div id="result"></div>
</div>
<script>
    const markerSizes = { coin1: 2.05, coin5: 2.50, coin10: 2.20, card: 8.56 };
    let currentCircumference = 0;
    let editMode = 'melon';
    let cardOrientation = 'horizontal';
    let melonViz = { x: 160, y: 160, rX: 75, rY: 75 };
    let markerViz = { x: 160, y: 100, r: 15 };
    let imgObj = null;
    let canvas, ctx;

    function toggleMethod() {
        const method = document.getElementById('method').value;
        const tapeSec = document.getElementById('tape-section');
        const photoSec = document.getElementById('photo-section');
        document.getElementById('result').style.display = 'none';
        if (method === 'tape') { tapeSec.style.display = 'block'; photoSec.style.display = 'none'; updateWeightHint(); }
        else { tapeSec.style.display = 'none'; photoSec.style.display = 'block'; if (imgObj) drawScanner(); else document.getElementById('weight-hint-text').style.display = 'none'; }
    }

    function toggleCardOrientation() { cardOrientation = (cardOrientation === 'horizontal') ? 'vertical' : 'horizontal'; drawScanner(); }

    function handlePhoto(e) {
        const files = e.target.files; if (!files || files.length === 0) return;
        imgObj = new Image();
        imgObj.onload = function() {
            canvas = document.getElementById('scanner-canvas'); ctx = canvas.getContext('2d');
            canvas.width = 320; canvas.height = (imgObj.height / imgObj.width) * 320;
            document.getElementById('canvas-container').style.display = 'block';
            document.getElementById('card-orient-btn').style.display = (document.getElementById('method').value === 'card') ? 'block' : 'none';
            melonViz.x = canvas.width / 2; melonViz.y = canvas.height / 2;
            melonViz.rX = 75; melonViz.rY = 75;
            markerViz.x = canvas.width / 2; markerViz.y = canvas.height / 2 - 40;
            initTouchEvents(); drawScanner();
        }
        imgObj.src = URL.createObjectURL(files[0]);
    }

    function setEditMode(mode) {
        editMode = mode;
        document.getElementById('mode-melon').classList.toggle('active', mode === 'melon');
        document.getElementById('mode-marker').classList.toggle('active', mode === 'marker');
        document.getElementById('melon-controls').style.display = (mode === 'melon') ? 'flex' : 'none';
        document.getElementById('marker-controls').style.display = (mode === 'marker') ? 'flex' : 'none';
        drawScanner();
    }
    
    function adjustSize(axis, amount) {
        if (editMode === 'melon') {
            if (axis === 'width' || axis === 'all') melonViz.rX += amount;
            if (axis === 'height' || axis === 'all') melonViz.rY += amount;
            if (melonViz.rX < 15) melonViz.rX = 15; if (melonViz.rY < 15) melonViz.rY = 15;
        } else {
            markerViz.r += amount; if (markerViz.r < 5) markerViz.r = 5;
        }
        drawScanner();
    }

    function initTouchEvents() {
        let isDragging = false;
        const getCoords = (e) => {
            const rect = canvas.getBoundingClientRect();
            const touch = (e.touches && e.touches.length > 0) ? e.touches[0] : e;
            return { x: ((touch.clientX - rect.left) / rect.width) * canvas.width, y: ((touch.clientY - rect.top) / rect.height) * canvas.height };
        };
        canvas.onmousedown = () => { isDragging = true; }; canvas.onmouseup = () => { isDragging = false; };
        canvas.ontouchstart = () => { isDragging = true; }; canvas.ontouchend = () => { isDragging = false; };
        const moveHandler = (e) => {
            if (!isDragging) return; if (e.touches) e.preventDefault(); const coords = getCoords(e);
            if (isNaN(coords.x) || isNaN(coords.y)) return;
            if (editMode === 'melon') { melonViz.x = coords.x; melonViz.y = coords.y; } else { markerViz.x = coords.x; markerViz.y = coords.y; } drawScanner();
        };
        canvas.onmousemove = moveHandler; canvas.ontouchmove = moveHandler;
    }
    function drawScanner() {
        if (!imgObj || !canvas) return; ctx.drawImage(imgObj, 0, 0, canvas.width, canvas.height);
        ctx.beginPath(); ctx.strokeStyle = '#4caf50'; ctx.lineWidth = 3;
        ctx.ellipse(melonViz.x, melonViz.y, melonViz.rX, melonViz.rY, 0, 0, 2 * Math.PI); ctx.stroke();

        const method = document.getElementById('method').value;
        ctx.beginPath(); ctx.strokeStyle = '#ff5252'; ctx.lineWidth = 3;
        if (method === 'card') {
            if (cardOrientation === 'horizontal') { ctx.rect(markerViz.x - markerViz.r * 1.5, markerViz.y - markerViz.r, markerViz.r * 3, markerViz.r * 2); }
            else { ctx.rect(markerViz.x - markerViz.r, markerViz.y - markerViz.r * 1.5, markerViz.r * 2, markerViz.r * 3); }
        } else { ctx.arc(markerViz.x, markerViz.y, markerViz.r, 0, 2 * Math.PI); }
        ctx.stroke();

        const markerRealSize = markerSizes[method];
        let pxPerCm = (method === 'card') ? (markerViz.r * 3) / markerRealSize : (markerViz.r * 2) / markerRealSize;
        const averageDiameter = Math.sqrt(melonViz.rX * melonViz.rY) * 2;
        currentCircumference = (averageDiameter / pxPerCm) * Math.PI;
        updateWeightHint();
    }

    function updateWeightHint() {
        const method = document.getElementById('method').value; const variety = document.getElementById('variety').value; const hintDiv = document.getElementById('weight-hint-text');
        let circ = (method === 'tape') ? parseFloat(document.getElementById('circ').value) : currentCircumference;
        if (method === 'tape') currentCircumference = circ;
        if (!circ || circ < 20) { hintDiv.style.display = 'none'; return; }
        const radius = circ / (2 * Math.PI); let baseVolume = (4 / 3) * Math.PI * Math.pow(radius, 3) / 1000;
        let kForm = (variety === 'oval') ? 1.28 : 1.0; let kBark = (variety === 'oval') ? 0.98 : (variety === 'yellow' ? 0.92 : 1.0);
        const finalVolume = baseVolume * kForm; hintDiv.style.display = 'block';
        hintDiv.innerHTML = `📋 <b>Оптимальный вес для ${circ.toFixed(1)} см:</b> от <b>${((0.90 * finalVolume) / kBark).toFixed(2)}</b> до <b>${((0.98 * finalVolume) / kBark).toFixed(2)} кг</b>`;
    }

    function analyzeWatermelon() {
        const method = document.getElementById('method').value; const variety = document.getElementById('variety').value; const weight = parseFloat(document.getElementById('weight').value); const resultDiv = document.getElementById('result');
        if (method !== 'tape' && currentCircumference === 0) { alert('Пожалуйста, сначала загрузите фото арбуза!'); return; }
        if (!currentCircumference || !weight) { alert('Заполните вес и габариты!'); return; }
        document.getElementById('weight-hint-text').style.display = 'none';
        const circ = currentCircumference; const radius = circ / (2 * Math.PI); let baseVolume = (4 / 3) * Math.PI * Math.pow(radius, 3) / 1000;
        let kForm = 1.0; let kBark = 1.0; let cheatLimit = 1.15;
        if (variety === 'oval') { kForm = 1.28; kBark = 0.98; cheatLimit = 1.05; } else if (variety === 'yellow') { kBark = 0.92; cheatLimit = 1.10; }
        const finalVolume = baseVolume * kForm; const density = (weight * kBark) / finalVolume; resultDiv.style.display = 'block';

        if (density > cheatLimit) {
            resultDiv.className = 'cheat';
            resultDiv.innerHTML = `<b>🛑 ПОДОЗРЕНИЕ НА ОБВЕС!</b><br><div style="text-align: left; margin-top: 5px; font-size: 14px;">Вес <b>${weight} кг</b> невозможен для обхвата в <b>${circ.toFixed(1)} см</b>.<br><br>• Максимум: <b>${((1.01 * finalVolume) / kBark).toFixed(2)} кг</b>.<br>• Вес спелого: около <b>${((0.94 * finalVolume) / kBark).toFixed(2)} кг</b>.</div>`;
            return;
        }

        let score = 2;
        if (density >= 0.93 && density <= 0.95) score = 10; else if (density > 0.95 && density <= 0.96) score = 9; else if (density >= 0.91 && density < 0.93) score = 8; else if (density > 0.96 && density <= 0.97) score = 7; else if (density >= 0.88 && density < 0.91) score = 6; else if (density > 0.97 && density <= 0.98) score = 5; else if (density >= 0.81 && density < 0.88) score = 5; else if (density >= 0.76 && density < 0.81) score = 4;
        const scoreGuide = `<div class="score-info">💡 Референс: Арбузы с оценкой 7/10 и выше считаются оптимальными для покупки.</div>`;

        if (density > 0.98) { resultDiv.className = 'unripe'; resultDiv.innerHTML = `<div class="score-badge">📊 Оценка: ${score}/10</div><br><b>❌ НЕДОЗРЕЛЫЙ (${density.toFixed(2)})</b><br><small>Мякоть плотная и травянистая.</small>${scoreGuide}`; }
        else if (density >= 0.90 && density <= 0.98) { resultDiv.className = 'ripe'; resultDiv.innerHTML = `<div class="score-badge">📊 Оценка: ${score}/10</div><br><b>🎉 ИДЕАЛЬНО СПЕЛЫЙ! (${density.toFixed(2)})</b><br><small>Мякоть плотная, сочная и равномерно сладкая.</small>${scoreGuide}`; }
        else { resultDiv.className = 'overripe'; resultDiv.innerHTML = `<div class="score-badge">📊 Оценка: ${score}/10</div><br><b>⚠️ ВАТНЫЙ / СВЕРХСЛАДКИЙ (${density.toFixed(2)})</b><br><small>Мякоть крупчатая, но рыхлая. Корка натянута.</small>${scoreGuide}`; }
    }
</script>
</body>
</html>
