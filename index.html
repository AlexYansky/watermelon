<!DOCTYPE html>
<html lang="ru">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
    <title>Спелый арбуз</title>
    <style>
        body { font-family: -apple-system, BlinkMacSystemFont, sans-serif; background: #f0f4f1; color: #2c3e50; padding: 15px; margin: 0; }
        .card { background: white; padding: 25px; border-radius: 20px; box-shadow: 0 10px 30px rgba(0,0,0,0.08); max-width: 420px; margin: 10px auto; box-sizing: border-box; }
        h1 { text-align: center; color: #1b5e20; font-size: 24px; margin-top: 0; margin-bottom: 5px; }
        .subtitle { text-align: center; color: #7f8c8d; font-size: 13px; margin-bottom: 25px; }
        label { display: block; font-weight: bold; margin: 15px 0 6px; font-size: 14px; color: #34495e; }
        select, input { width: 100%; padding: 14px 14px 14px 42px; border: 2px solid #bdc3c7; border-radius: 10px; box-sizing: border-box; font-size: 16px; outline: none; background: #fff; }
        select { padding-left: 15px; }
        .input-wrapper { position: relative; width: 100%; }
        .input-icon { position: absolute; left: 14px; top: 50%; transform: translateY(-50%); font-size: 18px; color: #7f8c8d; pointer-events: none; }
        button { width: 100%; background: #4caf50; color: white; border: none; padding: 16px; border-radius: 10px; font-size: 17px; font-weight: bold; margin-top: 25px; cursor: pointer; }
        #result { margin-top: 25px; padding: 18px; border-radius: 12px; display: none; text-align: center; font-size: 15px; line-height: 1.5; }
        .ripe { background: #e8f5e9; color: #1b5e20; border: 2px solid #81c784; }
        .unripe { background: #ffebee; color: #b71c1c; border: 2px solid #e57373; }
        .overripe { background: #fff8e1; color: #f57f17; border: 2px solid #ffb74d; }
        .cheat { background: #eceff1; color: #37474f; border: 2px solid #b0bec5; }
        .hint-box { background: #f4f9f4; border-left: 4px solid #4caf50; border-radius: 4px; padding: 10px 14px; margin: 15px 0; font-size: 13px; line-height: 1.4; color: #2e7d32; }
        .score-badge { display: inline-block; font-size: 28px; font-weight: bold; margin-bottom: 10px; padding: 5px 15px; border-radius: 10px; background: rgba(255,255,255,0.6); }
        .weight-hint { margin-top: 6px; font-size: 13px; color: #2e7d32; font-weight: 500; display: none; padding-left: 5px; }
        .score-info { font-size: 12px; margin-top: 8px; font-weight: bold; opacity: 0.8; }
        
        /* Стили стильного подвала и стихотворения */
        .footer { text-align: center; margin-top: 30px; font-size: 12px; color: #7f8c8d; border-top: 1px dashed #bdc3c7; padding-top: 15px; }
        .creator-name { font-weight: bold; color: #2c3e50; margin-bottom: 10px; font-size: 13px; }
        .poem-box { font-style: italic; color: #556b2f; line-height: 1.6; background: #f9fbf9; padding: 12px; border-radius: 8px; border-left: 3px solid #81c784; display: inline-block; text-align: left; }
    </style>
</head>
<body>
<div class="card">
    <h1>🍉 Спелый арбуз</h1>
    <label for="variety">Тип / Сорт арбуза</label>
    <select id="variety" onchange="updateWeightHint()">
        <option value="oval">Вытянутый / Овальный</option>
        <option value="classic">Обычный круглый полосатый</option>
        <option value="yellow">Желтый / Без семечек</option>
    </select>
    
    <div class="hint-box">
        💡 <b>Правило замера:</b> Обхватите арбуз лентой строго <b>поперек (по экватору)</b>, как если бы плод стоял хвостиком вверх.
    </div>

    <label for="circ">Длина окружности (см)</label>
    <div class="input-wrapper">
        <span class="input-icon">📏</span>
        <input type="number" id="circ" placeholder="Введите обхват поперек" oninput="updateWeightHint()">
    </div>

    <label for="weight" style="margin-top:15px;">Точный вес арбуза (кг)</label>
    <div class="input-wrapper">
        <span class="input-icon">⚖️</span>
        <input type="number" id="weight" placeholder="Например: 8.63" step="0.01">
    </div>
    <div id="weight-hint-text" class="weight-hint"></div>

    <button onclick="analyzeWatermelon()">Проверить спелость</button>
    <div id="result"></div>

    <!-- Обновленный подвал со стихотворением -->
    <div class="footer">
        <div class="creator-name">Разработка: Александр Янпольский</div>
        <div class="poem-box">
            Арбуз и солнце день чудесный,<br>
            Но даже если солнца нет.<br>
            Не перестанет быть чудесным<br>
            Тот день, в котором есть арбуз 🍉
        </div>
    </div>
</div>

<script>
    function updateWeightHint() {
        const variety = document.getElementById('variety').value;
        const circ = parseFloat(document.getElementById('circ').value);
        const hintDiv = document.getElementById('weight-hint-text');
        document.getElementById('result').style.display = 'none';

        if (!circ || circ < 20) { hintDiv.style.display = 'none'; return; }

        const radius = circ / (2 * Math.PI);
        let baseVolume = (4 / 3) * Math.PI * Math.pow(radius, 3) / 1000;
        let kForm = (variety === 'oval') ? 1.28 : 1.0;
        let kBark = (variety === 'oval') ? 0.98 : (variety === 'yellow' ? 0.92 : 1.0);
        
        const finalVolume = baseVolume * kForm;
        hintDiv.style.display = 'block';
        hintDiv.innerHTML = `📋 <b>Оптимальный вес для ${circ} см:</b> от <b>${((0.90 * finalVolume) / kBark).toFixed(2)}</b> до <b>${((0.98 * finalVolume) / kBark).toFixed(2)} кг</b>`;
    }

    function analyzeWatermelon() {
        const variety = document.getElementById('variety').value;
        const circ = parseFloat(document.getElementById('circ').value);
        const weight = parseFloat(document.getElementById('weight').value);
        const resultDiv = document.getElementById('result');
        if (!circ || !weight) { alert('Заполните поля!'); return; }
        
        document.getElementById('weight-hint-text').style.display = 'none';
        const radius = circ / (2 * Math.PI);
        let baseVolume = (4 / 3) * Math.PI * Math.pow(radius, 3) / 1000;
        
        let kForm = 1.0; let kBark = 1.0; let cheatLimit = 1.15;
        if (variety === 'oval') { kForm = 1.28; kBark = 0.98; cheatLimit = 1.05; }
        else if (variety === 'yellow') { kBark = 0.92; cheatLimit = 1.10; }
        
        const finalVolume = baseVolume * kForm;
        const density = (weight * kBark) / finalVolume;
        resultDiv.style.display = 'block';

        if (density > cheatLimit) {
            resultDiv.className = 'cheat';
            resultDiv.innerHTML = `<b>🛑 ПОДОЗРЕНИЕ НА ОБВЕС!</b><br><div style="text-align: left; margin-top: 5px; font-size: 14px;">Вес <b>${weight} кг</b> невозможен для обхвата в <b>${circ} см</b>.<br><br>• Максимум: <b>${((1.01 * finalVolume) / kBark).toFixed(2)} кг</b>.<br>• Вес спелого: около <b>${((0.94 * finalVolume) / kBark).toFixed(2)} кг</b>.<br><br><span style="color: #c62828; font-weight: bold;">⚠️ Похоже, весы продавца завышают показания!</span></div>`;
            return;
        }

        let score = 2;
        if (density >= 0.93 && density <= 0.95) score = 10;
        else if (density > 0.95 && density <= 0.96) score = 9;
        else if (density >= 0.91 && density < 0.93) score = 8;
        else if (density > 0.96 && density <= 0.97) score = 7;
        else if (density >= 0.88 && density < 0.91) score = 6;
        else if (density > 0.97 && density <= 0.98) score = 5;
        else if (density >= 0.81 && density < 0.88) score = 5;
        else if (density >= 0.76 && density < 0.81) score = 4;

        const scoreGuide = `<div class="score-info">💡 Референс: Арбузы с оценкой 7/10 и выше считаются оптимальными для покупки.</div>`;

        if (density > 0.98) {
            resultDiv.className = 'unripe';
            resultDiv.innerHTML = `<div class="score-badge">📊 Оценка: ${score}/10</div><br><b>❌ НЕДОЗРЕЛЫЙ (${density.toFixed(2)})</b><br><div style="text-align: left; margin-top: 5px;"><small>Мякоть плотная, водянистая и травянистая.</small></div>${scoreGuide}`;
        } else if (density >= 0.90 && density <= 0.98) {
            resultDiv.className = 'ripe';
            resultDiv.innerHTML = `<div class="score-badge">📊 Оценка: ${score}/10</div><br><b>🎉 ИДЕАЛЬНО СПЕЛЫЙ! (Плотность: ${density.toFixed(2)})</b><br><div style="text-align: left; margin-top: 5px;"><small>Мякоть плотная, хрустящая, очень сочная и равномерно сладкая.</small></div>${scoreGuide}`;
        } else {
            resultDiv.className = 'overripe';
            resultDiv.innerHTML = `<div class="score-badge">📊 Оценка: ${score}/10</div><br><b>⚠️ ВАТНЫЙ / СВЕРХСЛАДКИЙ (${density.toFixed(2)})</b><br><div style="text-align: left; margin-top: 5px;"><small>Мякоть имеет повышенную сахаристость («крупчатая»), но структура уже ватно-рыхлая. Плод может сам треснуть при надрезе ножом.</small></div>${scoreGuide}`;
        }
    }
</script>
</body>
</html>
